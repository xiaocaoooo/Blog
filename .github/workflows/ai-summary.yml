name: AI Summary

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/posts/**/*.md'
  workflow_dispatch:

jobs:
  summarize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v42
        with:
          files: src/content/posts/**/*.md

      - name: Determine files to process
        id: files-to-process
        run: |
          TOUCH_FILE="files_to_process.txt"
          touch $TOUCH_FILE
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' > $TOUCH_FILE
          else
            find src/content/posts/ -name "*.md" | while read -r file; do
              if ! grep -q "<!-- ai-summary-start -->" "$file"; then
                echo "$file" >> $TOUCH_FILE
              fi
            done
          fi
          COUNT=$(wc -l < $TOUCH_FILE)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Run AI Summary
        if: steps.files-to-process.outputs.count != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASEURL: ${{ secrets.OPENAI_BASEURL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          BYPASS_CF: ${{ secrets.BYPASS_CF }}
          ORIGIN_IP: ${{ secrets.ORIGIN_IP }}
          TARGET_DOMAIN: ${{ secrets.TARGET_DOMAIN }}
        run: |
          shopt -s globstar

          MODEL="${OPENAI_MODEL:-gpt-4o-mini}"
          HOST_HEADER=""

          if [ "${BYPASS_CF}" == "true" ]; then
            echo "Mode: Bypass Cloudflare (Direct Origin IP)"
            API_URL="https://${ORIGIN_IP}/v1/chat/completions"
            HOST_HEADER="Host:${TARGET_DOMAIN}"
          else
            echo "Mode: Public Route (via Cloudflare/Proxy)"
            BASE_URL="${OPENAI_BASEURL:-https://api.openai.com/v1}"
            CLEAN_URL=$(echo "$BASE_URL" | sed 's:/*$::')
            API_URL="${CLEAN_URL}/chat/completions"
          fi
          echo "Target API URL: $API_URL"

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "--- Processing: $file ---"

            sed '/<!-- ai-summary-start -->/,/<!-- ai-summary-end -->/d' "$file" > body.tmp

            # English Prompt for better reasoning, requesting Simplified Chinese output.
            # Focuses on "Finding + Brief Explanation" to balance length.
            SYSTEM_PROMPT="You are a professional technical editor. Analyze the provided blog post and synthesize its core value, key problems solved, and final conclusions.

            Requirements:
            1. Language: You MUST output the summary in Simplified Chinese.
            2. Format: Use a Markdown unordered list with 3 to 5 high-impact bullet points.
            3. Content Density: Each point should follow the pattern of [Core Takeaway]: [Brief Explanation]. Avoid overly brief one-liners or excessively long paragraphs.
            4. Style: Maintain a professional, objective, and concise tone.
            5. Constraints: Output ONLY the summary content. No preamble (e.g., 'This article discusses...'), no introductory remarks, no closing statements, and no quotation marks."

            JSON_PAYLOAD=$(jq -n \
              --rawfile user body.tmp \
              --arg sys "$SYSTEM_PROMPT" \
              --arg model "$MODEL" \
              '{model: $model, messages: [{role: "system", content: $sys}, {role: "user", content: $user}], temperature: 0.7}')

            MAX_RETRIES=5
            RETRY_COUNT=0
            SUMMARY=""

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."

              if [ -n "$HOST_HEADER" ]; then
                RESPONSE_FULL=$(curl -sLk -A "$UA" \
                  -H "$HOST_HEADER" \
                  -H "Authorization: Bearer $OPENAI_API_KEY" \
                  -H "Content-Type: application/json" \
                  -d "$JSON_PAYLOAD" \
                  "$API_URL" \
                  -w "\n%{http_code}")
              else
                RESPONSE_FULL=$(curl -sL -A "$UA" \
                  -H "Authorization: Bearer $OPENAI_API_KEY" \
                  -H "Content-Type: application/json" \
                  -d "$JSON_PAYLOAD" \
                  "$API_URL" \
                  -w "\n%{http_code}")
              fi

              HTTP_STATUS=$(echo "$RESPONSE_FULL" | tail -n 1)
              RESPONSE_BODY=$(echo "$RESPONSE_FULL" | sed '$d')

              echo "HTTP Status: $HTTP_STATUS"
              echo "Full Response Body: $RESPONSE_BODY"

              if [ "$HTTP_STATUS" -eq 200 ]; then
                SUMMARY=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // empty' 2>/dev/null | sed 's/^[ \t]*//;s/[ \t]*$//')
                if [ -n "$SUMMARY" ] && [ "$SUMMARY" != "null" ]; then
                  break
                fi
              elif [ "$HTTP_STATUS" -eq 403 ]; then
                echo "Error 403: Forbidden. Cloudflare challenge detected."
                sleep 10
              fi

              echo "Error: Invalid response or empty content."
              RETRY_COUNT=$((RETRY_COUNT + 1))
              [ $RETRY_COUNT -lt $MAX_RETRIES ] && sleep $(( 2 ** RETRY_COUNT ))
            done

            if [ -z "$SUMMARY" ] || [ "$SUMMARY" == "null" ]; then
              echo "FAILED to get summary for $file. Skipping."
              rm -f body.tmp
              continue
            fi

            printf "<!-- ai-summary-start -->\n<details>\n  <summary>AI Summary</summary>\n  <div class=\"ai-summary-content\">\n\n%s\n\n  </div>\n</details>\n<!-- ai-summary-end -->\n" "$SUMMARY" > summary_block.tmp

            if grep -q "<!-- ai-summary-start -->" "$file"; then
              awk 'BEGIN {while ((getline line < "summary_block.tmp") > 0) {block = block line "\n"}} /<!-- ai-summary-start -->/ {printf "%s", block; skip = 1; next} /<!-- ai-summary-end -->/ {skip = 0; next} skip {next} {print}' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
            else
              SECOND_DASH_LINE=$(grep -n "^---$" "$file" | sed -n '2p' | cut -d: -f1)
              [ -z "$SECOND_DASH_LINE" ] && SECOND_DASH_LINE=0
              head -n "$SECOND_DASH_LINE" "$file" > "$file.tmp"
              echo "" >> "$file.tmp"
              cat summary_block.tmp >> "$file.tmp"
              echo "" >> "$file.tmp"
              tail -n +$((SECOND_DASH_LINE + 1)) "$file" >> "$file.tmp"
              mv "$file.tmp" "$file"
            fi
            rm -f body.tmp summary_block.tmp
          done < files_to_process.txt

      - name: Commit and Push
        if: steps.files-to-process.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet src/content/posts/; then
            echo "Changes detected, committing..."
            git add src/content/posts/
            git commit -m "docs: update AI summaries"
            git push
          else
            echo "No changes to commit."
          fi
